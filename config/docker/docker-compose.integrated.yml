version: '3.8'

services:
  # Existing WasteWise Application
  wastewise-backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped
    
  wastewise-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    
  # Data Platform
  data-platform:
    build: ./data-platform
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    
  # Shared Infrastructure
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wastewise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - wastewise-backend
      - wastewise-frontend
      - data-platform
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: