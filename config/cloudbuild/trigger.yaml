# Cloud Build Trigger Configuration
# This file defines the trigger for automatic builds on GitHub push

name: wastewise-auto-deploy
description: "Auto-deploy WasteWise application on GitHub push to main branch"

# Trigger configuration
triggerTemplate:
  projectId: ${PROJECT_ID}
  repoName: github_basyirsheerscomputer_wastewise-30
  branchName: main
  dir: "."

# Build configuration
build:
  steps:
    # Use the main cloudbuild.yaml file
    - name: 'gcr.io/cloud-builders/docker'
      args: ['build', '-t', 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA', '-f', 'Dockerfile.backend', '.']
    
    - name: 'gcr.io/cloud-builders/docker'
      args: 
        - 'build'
        - '-t'
        - 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA'
        - '-f'
        - 'Dockerfile.frontend'
        - '--build-arg'
        - 'VITE_SUPABASE_URL=$$VITE_SUPABASE_URL'
        - '--build-arg'
        - 'VITE_SUPABASE_ANON_KEY=$$VITE_SUPABASE_ANON_KEY'
        - '--build-arg'
        - 'VITE_STRIPE_PUBLISHABLE_KEY=$$VITE_STRIPE_PUBLISHABLE_KEY'
        - '--build-arg'
        - 'VITE_API_BASE_URL=$$VITE_API_BASE_URL'
        - '--build-arg'
        - 'VITE_TRIAL_PERIOD_DAYS=$$VITE_TRIAL_PERIOD_DAYS'
        - '.'
      secretEnv: ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'VITE_STRIPE_PUBLISHABLE_KEY', 'VITE_API_BASE_URL', 'VITE_TRIAL_PERIOD_DAYS']

    - name: 'gcr.io/cloud-builders/docker'
      args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA']

    - name: 'gcr.io/cloud-builders/docker'
      args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA']

         - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
       entrypoint: gcloud
       args:
         - 'run'
         - 'deploy'
         - 'wastewise-backend'
         - '--image'
         - 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA'
         - '--region'
         - 'asia-southeast1'
         - '--platform'
         - 'managed'
         - '--allow-unauthenticated'
         - '--port'
         - '3000'
         - '--memory'
         - '512Mi'
         - '--cpu'
         - '1'
         - '--min-instances'
         - '0'
         - '--max-instances'
         - '2'
         - '--set-env-vars'
         - 'NODE_ENV=production,PORT=3000'
        - '--set-secrets'
        - 'SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-key:latest,JWT_SECRET=jwt-secret:latest,GEMINI_API_KEY=gemini-api-key:latest,OPENAI_API_KEY=openai-api-key:latest'

         - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
       entrypoint: gcloud
       args:
         - 'run'
         - 'deploy'
         - 'wastewise-frontend'
         - '--image'
         - 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA'
         - '--region'
         - 'asia-southeast1'
         - '--platform'
         - 'managed'
         - '--allow-unauthenticated'
         - '--port'
         - '8899'
         - '--memory'
         - '256Mi'
         - '--cpu'
         - '1'
         - '--min-instances'
         - '0'
         - '--max-instances'
         - '2'
         - '--set-env-vars'
         - 'VITE_API_BASE_URL=https://wastewise-backend-${PROJECT_ID}-as.a.run.app'
        - '--set-secrets'
        - 'VITE_SUPABASE_URL=supabase-url:latest,VITE_SUPABASE_ANON_KEY=supabase-anon-key:latest,VITE_STRIPE_PUBLISHABLE_KEY=stripe-publishable-key:latest,VITE_TRIAL_PERIOD_DAYS=trial-period-days:latest'

  # Available secrets
  availableSecrets:
    secretManager:
      - versionName: projects/$PROJECT_ID/secrets/supabase-url/versions/latest
        env: 'VITE_SUPABASE_URL'
      - versionName: projects/$PROJECT_ID/secrets/supabase-anon-key/versions/latest
        env: 'VITE_SUPABASE_ANON_KEY'
      - versionName: projects/$PROJECT_ID/secrets/stripe-publishable-key/versions/latest
        env: 'VITE_STRIPE_PUBLISHABLE_KEY'
      - versionName: projects/$PROJECT_ID/secrets/api-base-url/versions/latest
        env: 'VITE_API_BASE_URL'
      - versionName: projects/$PROJECT_ID/secrets/trial-period-days/versions/latest
        env: 'VITE_TRIAL_PERIOD_DAYS'

  # Images to be pushed
  images:
    - 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA'
    - 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA'

     # Build options
   options:
     logging: CLOUD_LOGGING_ONLY
     machineType: 'E2_HIGHCPU_4'
     diskSizeGb: '50'
     env:
       - 'DOCKER_BUILDKIT=1'
       - 'COMPOSE_DOCKER_CLI_BUILD=1'

  # Timeout
  timeout: '1800s'

# Include files that should trigger the build
includedFiles:
  - "**/*.js"
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.json"
  - "**/*.yaml"
  - "**/*.yml"
  - "Dockerfile.*"
  - "package.json"
  - "package-lock.json"

# Exclude files that shouldn't trigger builds
ignoredFiles:
  - "**/*.md"
  - "**/*.txt"
  - "**/*.log"
  - "node_modules/**"
  - ".git/**"
  - "docs/**"
  - "scripts/**"
