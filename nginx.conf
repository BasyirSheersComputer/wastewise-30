server {
    listen 80;
    server_name localhost;
    
    # Set the root directory to where the built files are located
    # This is crucial for serving static assets correctly
    root /usr/share/nginx/html;

    # This is the key part for SPA routing.
    # It tries to serve a static file first. If it can't, it serves
    # the application's root index.html file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}