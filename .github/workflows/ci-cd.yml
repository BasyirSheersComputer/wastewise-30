name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run linting
        run: |
          cd backend && npm run lint
          cd ../frontend && npm run lint

      - name: Run type checking
        run: |
          cd frontend && npm run type-check

  # Job 2: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run backend tests
        run: |
          cd backend && npm test
        env:
          NODE_ENV: test

      - name: Run frontend tests
        run: |
          cd frontend && npm test -- --coverage --watchAll=false

  # Job 3: Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 4: Build and Deploy (only on main branch)
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Submit to Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_REGION=$REGION \
            --project $PROJECT_ID

             - name: Get deployment URLs
         run: |
           echo "Backend URL: https://wastewise-backend-$PROJECT_ID-as.a.run.app"
           echo "Frontend URL: https://wastewise-frontend-$PROJECT_ID-as.a.run.app"
           echo "Backend URL: https://wastewise-backend-$PROJECT_ID-as.a.run.app" >> $GITHUB_STEP_SUMMARY
           echo "Frontend URL: https://wastewise-frontend-$PROJECT_ID-as.a.run.app" >> $GITHUB_STEP_SUMMARY

  # Job 5: Integration Tests (after deployment)
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Wait for deployment
        run: sleep 60

             - name: Run integration tests
         run: |
           # Test backend health endpoint
           curl -f https://wastewise-backend-$PROJECT_ID-as.a.run.app/health || exit 1
           
           # Test frontend loads
           curl -f https://wastewise-frontend-$PROJECT_ID-as.a.run.app/ || exit 1
         env:
           PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  # Job 6: Notify deployment status
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
                     echo "**Services:**" >> $GITHUB_STEP_SUMMARY
           echo "- Backend: https://wastewise-backend-${{ secrets.GCP_PROJECT_ID }}-as.a.run.app" >> $GITHUB_STEP_SUMMARY
           echo "- Frontend: https://wastewise-frontend-${{ secrets.GCP_PROJECT_ID }}-as.a.run.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
