version: '3.8'

services:
  wastewise-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://wastewise-backend:3000}
        VITE_TRIAL_PERIOD_DAYS: ${VITE_TRIAL_PERIOD_DAYS:-30}
    container_name: wastewise-frontend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
    depends_on:
      wastewise-backend:
        condition: service_healthy
    networks:
      - wastewise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  wastewise-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wastewise-backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    networks:
      - wastewise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  wastewise-network:
    driver: bridge
    name: wastewise-network