# Google Cloud Build Configuration for WasteWise-30
# Auto-triggered on GitHub push to main branch

steps:
  # Stage 1: Build backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '.'

  # Stage 2: Build frontend (without secrets for now)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '.'

  # Stage 3: Push images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:latest']
    waitFor: ['push-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID']
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:latest']
    waitFor: ['push-frontend']

  # Stage 4: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=3000'
    waitFor: ['push-backend-latest']

  # Stage 5: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'VITE_API_BASE_URL=https://wastewise-backend-$PROJECT_ID-as.a.run.app'
    waitFor: ['deploy-backend']

  # Stage 6: Update backend CORS with frontend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-cors'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'wastewise-backend'
      - '--region'
      - 'asia-southeast1'
      - '--set-env-vars'
      - 'CORS_ORIGIN=https://wastewise-frontend-$PROJECT_ID-as.a.run.app'
    waitFor: ['deploy-frontend']

  # Stage 7: Run smoke tests
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-backend'
    args: 
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-backend-$PROJECT_ID-as.a.run.app/health'
    waitFor: ['update-cors']

  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-frontend'
    args: 
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-frontend-$PROJECT_ID-as.a.run.app/'
    waitFor: ['smoke-test-backend']

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '50'
  env:
    - 'DOCKER_BUILDKIT=1'
    - 'COMPOSE_DOCKER_CLI_BUILD=1'

# Timeout for the entire build
timeout: '1800s'
