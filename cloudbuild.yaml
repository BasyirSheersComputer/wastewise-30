# Google Cloud Build Configuration for WasteWise-30
# Auto-triggered on GitHub push to main branch

steps:
  # Stage 1: Build backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '.'

  # Stage 2: Build frontend with secrets
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    secretEnv: ['FRONTEND_SECRET']
    entrypoint: 'bash'
    args: 
      - '-c'
      - |
        # Extract environment variables from the frontend secret
        echo "$${_FRONTEND_SECRET}" > /tmp/frontend-secrets.env
        
        echo "=== Secret Content Debug ==="
        echo "Secret file content:"
        cat /tmp/frontend-secrets.env
        echo "=== End Secret Content ==="
        
        # Parse the secret and extract individual variables with better error handling
        # Remove comments and empty lines, then extract variables
        grep -v '^#' /tmp/frontend-secrets.env | grep -v '^$' > /tmp/clean-secrets.env
        
        echo "=== Clean Secret Content ==="
        cat /tmp/clean-secrets.env
        echo "=== End Clean Secret Content ==="
        
        if grep -q "^VITE_SUPABASE_URL=" /tmp/clean-secrets.env; then
          export VITE_SUPABASE_URL=$(grep "^VITE_SUPABASE_URL=" /tmp/clean-secrets.env | cut -d'=' -f2-)
          echo "✅ Found VITE_SUPABASE_URL: $${VITE_SUPABASE_URL:0:30}..."
        else
          echo "❌ VITE_SUPABASE_URL not found in secret"
          export VITE_SUPABASE_URL=""
        fi
        
        if grep -q "^VITE_SUPABASE_ANON_KEY=" /tmp/clean-secrets.env; then
          export VITE_SUPABASE_ANON_KEY=$(grep "^VITE_SUPABASE_ANON_KEY=" /tmp/clean-secrets.env | cut -d'=' -f2-)
          echo "✅ Found VITE_SUPABASE_ANON_KEY: $${VITE_SUPABASE_ANON_KEY:0:30}..."
        else
          echo "❌ VITE_SUPABASE_ANON_KEY not found in secret"
          export VITE_SUPABASE_ANON_KEY=""
        fi
        
        if grep -q "^VITE_STRIPE_PUBLISHABLE_KEY=" /tmp/clean-secrets.env; then
          export VITE_STRIPE_PUBLISHABLE_KEY=$(grep "^VITE_STRIPE_PUBLISHABLE_KEY=" /tmp/clean-secrets.env | cut -d'=' -f2-)
          echo "✅ Found VITE_STRIPE_PUBLISHABLE_KEY: $${VITE_STRIPE_PUBLISHABLE_KEY:0:30}..."
        else
          echo "❌ VITE_STRIPE_PUBLISHABLE_KEY not found in secret"
          export VITE_STRIPE_PUBLISHABLE_KEY=""
        fi
        
        echo "=== Environment Variables ==="
        echo "VITE_SUPABASE_URL: $${VITE_SUPABASE_URL}"
        echo "VITE_SUPABASE_ANON_KEY: $${VITE_SUPABASE_ANON_KEY}"
        echo "VITE_STRIPE_PUBLISHABLE_KEY: $${VITE_STRIPE_PUBLISHABLE_KEY}"
        echo "=== End Environment Variables ==="
        
        # Build the frontend with extracted environment variables
        docker build \
          -t gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID \
          -t gcr.io/$PROJECT_ID/wastewise-frontend:latest \
          -f Dockerfile.frontend \
          --cache-from gcr.io/$PROJECT_ID/wastewise-frontend:latest \
          --build-arg VITE_SUPABASE_URL="$${VITE_SUPABASE_URL}" \
          --build-arg VITE_SUPABASE_ANON_KEY="$${VITE_SUPABASE_ANON_KEY}" \
          --build-arg VITE_STRIPE_PUBLISHABLE_KEY="$${VITE_STRIPE_PUBLISHABLE_KEY}" \
          --build-arg VITE_API_BASE_URL="https://wastewise-backend-$PROJECT_ID-as.a.run.app" \
          --build-arg VITE_TRIAL_PERIOD_DAYS="30" \
          .

  # Stage 3: Push images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:latest']
    waitFor: ['push-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID']
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:latest']
    waitFor: ['push-frontend']

  # Stage 4: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    secretEnv: ['BACKEND_SECRET']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - 'BACKEND_SECRET=wastewise-30-secret-backend:latest'
    waitFor: ['push-backend-latest']

  # Stage 5: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'VITE_API_BASE_URL=https://wastewise-backend-$PROJECT_ID-as.a.run.app'
    waitFor: ['deploy-backend']

  # Stage 6: Update backend CORS with frontend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-cors'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'wastewise-backend'
      - '--region'
      - 'asia-southeast1'
      - '--set-env-vars'
      - 'CORS_ORIGIN=https://wastewise-frontend-$PROJECT_ID-as.a.run.app'
    waitFor: ['deploy-frontend']

  # Stage 7: Run smoke tests
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-backend'
    args: 
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-backend-$PROJECT_ID-as.a.run.app/health'
    waitFor: ['update-cors']

  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-frontend'
    args: 
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-frontend-$PROJECT_ID-as.a.run.app/'
    waitFor: ['smoke-test-backend']

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '50'
  env:
    - 'DOCKER_BUILDKIT=1'
    - 'COMPOSE_DOCKER_CLI_BUILD=1'

# Available secrets for the build
availableSecrets:
  secretManager:
    - versionName: projects/wastewise-402ba/secrets/wastewise-30-secret/versions/latest
      env: 'FRONTEND_SECRET'
    - versionName: projects/wastewise-402ba/secrets/wastewise-30-secret-backend/versions/latest
      env: 'BACKEND_SECRET'

# Timeout for the entire build
timeout: '1800s'
