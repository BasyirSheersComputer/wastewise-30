# Google Cloud Build Configuration for WasteWise-30
# Auto-triggered on GitHub push to main branch
steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/wastewise-backend:latest', '-f', 'Dockerfile.backend', '.']
  
  # Build frontend with environment variables
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=https://fbdqrqknqphcyxbmnuaf.supabase.co'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZHFycWtucXBoY3l4Ym1udWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI0NzkwNDgsImV4cCI6MjA2ODA1NTA0OH0.ywEEaFhppnloTSLmAMxJby0bOIzCyxkT_exH6k2qxWI'
      - '--build-arg'
      - 'VITE_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://wastewise-backend-451983642521.asia-southeast1.run.app'
      - '--build-arg'
      - 'VITE_TRIAL_PERIOD_DAYS=30'
      - '.'
  
  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:latest']
  
  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:latest']
  
  # Deploy backend service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'
  
  # Deploy frontend service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'VITE_API_BASE_URL=https://wastewise-backend-451983642521.asia-southeast1.run.app,VITE_TRIAL_PERIOD_DAYS=30,VITE_SUPABASE_URL=https://fbdqrqknqphcyxbmnuaf.supabase.co,VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiZHFycWtucXBoY3l4Ym1udWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI0NzkwNDgsImV4cCI6MjA2ODA1NTA0OH0.ywEEaFhppnloTSLmAMxJby0bOIzCyxkT_exH6k2qxWI,VITE_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'