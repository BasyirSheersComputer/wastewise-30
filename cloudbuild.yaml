# Google Cloud Build Configuration for WasteWise-30
# Auto-triggered on GitHub push to main branch
steps:
  # Stage 1: Build and tag the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '.'

  # Stage 2: Build and tag the frontend Docker image with secrets passed as build-args
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    secretEnv: ['FRONTEND_SECRET']
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$FRONTEND_SECRET_VITE_SUPABASE_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$FRONTEND_SECRET_VITE_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'VITE_STRIPE_PUBLISHABLE_KEY=$FRONTEND_SECRET_VITE_STRIPE_PUBLISHABLE_KEY'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://wastewise-backend-$PROJECT_ID-as.a.run.app'
      - '--build-arg'
      - 'VITE_TRIAL_PERIOD_DAYS=30'
      - '.'
    waitFor: ['build-backend']

  # Stage 3: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$BUILD_ID'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - 'BACKEND_SECRET=wastewise-30-secret-backend:latest'
    waitFor: ['build-backend']

  # Stage 4: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$BUILD_ID'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'VITE_API_BASE_URL=https://wastewise-backend-$PROJECT_ID-as.a.run.app'
    waitFor: ['build-frontend']

  # Stage 5: Update backend CORS with frontend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-cors'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'wastewise-backend'
      - '--region'
      - 'asia-southeast1'
      - '--update-env-vars'
      - 'CORS_ORIGIN=https://wastewise-frontend-$PROJECT_ID-as.a.run.app'
    waitFor: ['deploy-backend']

  # Stage 6: Run smoke tests
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-backend'
    args:
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-backend-$PROJECT_ID-as.a.run.app/health'
    waitFor: ['update-cors']

  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-frontend'
    args:
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-frontend-$PROJECT_ID-as.a.run.app/'
    waitFor: ['smoke-test-backend']

# Images to be pushed to Container Registry (GCB does this automatically)
images:
  - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'

# Build options
options:
  # The machine type is still a good practice for faster builds
  machineType: 'E2_HIGHCPU_8'
  # The disk size is optional, 100GB is default but 50GB is fine if needed
  diskSizeGb: '50'

# Available secrets for the build
availableSecrets:
  secretManager:
    - versionName: projects/451983642521/secrets/wastewise-30-secret/versions/latest
      env: 'FRONTEND_SECRET'
    - versionName: projects/451983642521/secrets/wastewise-30-secret-backend/versions/latest
      env: 'BACKEND_SECRET'

# Top-level timeout for the entire build
timeout: '1800s'