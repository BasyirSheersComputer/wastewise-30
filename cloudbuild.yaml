# Google Cloud Build Configuration for WasteWise-30
# Auto-triggered on GitHub push to main branch

steps:
  # Stage 1: Build and test backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
      - '.'

  # Stage 2: Build frontend with environment variables
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$$VITE_SUPABASE_URL'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$$VITE_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'VITE_STRIPE_PUBLISHABLE_KEY=$$VITE_STRIPE_PUBLISHABLE_KEY'
      - '--build-arg'
      - 'VITE_API_BASE_URL=$$VITE_API_BASE_URL'
      - '--build-arg'
      - 'VITE_TRIAL_PERIOD_DAYS=$$VITE_TRIAL_PERIOD_DAYS'
      - '.'
    secretEnv: ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'VITE_STRIPE_PUBLISHABLE_KEY', 'VITE_API_BASE_URL', 'VITE_TRIAL_PERIOD_DAYS']

  # Stage 3: Run backend tests
  - name: 'gcr.io/cloud-builders/docker'
    id: 'test-backend'
    args: 
      - 'run'
      - '--rm'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA'
      - 'npm'
      - 'test'
    waitFor: ['build-backend']

  # Stage 4: Push images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA']
    waitFor: ['test-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-backend:latest']
    waitFor: ['push-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA']
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/wastewise-frontend:latest']
    waitFor: ['push-frontend']

  # Stage 5: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=3000'
      - '--set-secrets'
      - 'SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-key:latest,JWT_SECRET=jwt-secret:latest,GEMINI_API_KEY=gemini-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,SMTP_HOST=smtp-host:latest,SMTP_PORT=smtp-port:latest,SMTP_USER=smtp-user:latest,SMTP_PASS=smtp-pass:latest'
    waitFor: ['push-backend-latest']

  # Stage 6: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wastewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'VITE_API_BASE_URL=https://wastewise-backend-$PROJECT_ID-as.a.run.app'
      - '--set-secrets'
      - 'VITE_SUPABASE_URL=supabase-url:latest,VITE_SUPABASE_ANON_KEY=supabase-anon-key:latest,VITE_STRIPE_PUBLISHABLE_KEY=stripe-publishable-key:latest,VITE_TRIAL_PERIOD_DAYS=trial-period-days:latest'
    waitFor: ['deploy-backend']

  # Stage 7: Update backend CORS with frontend URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-cors'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'wastewise-backend'
      - '--region'
      - 'asia-southeast1'
      - '--set-env-vars'
      - 'CORS_ORIGIN=https://wastewise-frontend-$PROJECT_ID-as.a.run.app'
    waitFor: ['deploy-frontend']

  # Stage 8: Run smoke tests
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-backend'
    args: 
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-backend-$PROJECT_ID-as.a.run.app/health'
    waitFor: ['update-cors']

  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test-frontend'
    args: 
      - '--retry'
      - '3'
      - '--retry-delay'
      - '10'
      - 'https://wastewise-frontend-$PROJECT_ID-as.a.run.app/'
    waitFor: ['smoke-test-backend']

# Available secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/supabase-url/versions/latest
      env: 'VITE_SUPABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/supabase-anon-key/versions/latest
      env: 'VITE_SUPABASE_ANON_KEY'
    - versionName: projects/$PROJECT_ID/secrets/stripe-publishable-key/versions/latest
      env: 'VITE_STRIPE_PUBLISHABLE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/api-base-url/versions/latest
      env: 'VITE_API_BASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/trial-period-days/versions/latest
      env: 'VITE_TRIAL_PERIOD_DAYS'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/wastewise-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/wastewise-backend:latest'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/wastewise-frontend:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '50'
  env:
    - 'DOCKER_BUILDKIT=1'
    - 'COMPOSE_DOCKER_CLI_BUILD=1'

# Substitutions for dynamic values
substitutions:
  _REGION: 'asia-southeast1'

# Timeout for the entire build
timeout: '1800s'
